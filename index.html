<!DOCTYPE html>
<html itemscope itemtype="http://schema.org/SearchResultsPage" lang="en-US">

<head>
    <meta charset="UTF-8" />

    <meta name="referrer" content="origin" />
    <meta http-equiv="Content-Type" content="text/html" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="0" />

    <meta http-equiv="x-dns-prefetch-control" content="on" />

    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="all" />
    <meta name="renderer" content="webkit" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

    <meta content="yes" name="apple-touch-fullscreen" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f2329" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="nofollow">

    <link rel="icon" sizes="192x192" href="/public/platform/cmmetrics/logo.png">

    <!-- ios平台 safari -->
    <link rel="apple-touch-icon-precomposed" href="/public/platform/cmmetrics/logo.png">
    <script async type="text/javascript" src="/charting_library/charting_library.min.js"></script>
    <style>
        @Keyframes donut-spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #loading-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #loading-mask .donut {
            display: inline-block;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #613af1;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: donut-spin 1s linear infinite;
        }
    </style>
</head>

<body>
    <div id="app">
        <!--   加载页-动画节点 -->
        <div id="loading-mask">
            <div class="donut"></div>
        </div>
    </div>

    <script defer type="module" src="/src/main.js"></script>
</body>

</html>
